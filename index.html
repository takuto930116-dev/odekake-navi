<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>模擬店レジ</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--tx:#2b2118;--mut:#7a6a5a;--ac:#e8590c;--ac2:#2f9e44;--bd:#ecd9c0;--bad:#c92a2a;--wt:#fff3bf;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#2a231c;--tx:#f5ebdd;--mut:#b8a78f;--ac:#ff8a3d;--ac2:#51cf66;--bd:#4a3d30;--bad:#ff8787;--wt:#4a3f1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#2a231c;--tx:#f5ebdd;--mut:#b8a78f;--ac:#ff8a3d;--ac2:#51cf66;--bd:#4a3d30;--bad:#ff8787;--wt:#4a3f1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
.app{height:100%;display:grid;gap:6px;grid-template-rows:auto auto auto minmax(0,1fr) 120px;grid-template-areas:"head" "sum" "tabs" "main" "wait"}
.app[data-v="order"] .pay{display:none}
.app[data-v="pay"] .order{display:none}
.order,.pay{grid-area:main}
.sum{grid-area:sum}.wait{grid-area:wait}.tabs{grid-area:tabs}
@media(orientation:landscape) and (min-width:700px){
 .app{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.8fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"head head head" "sum sum wait" "order pay wait"}
 .tabs{display:none}
 .app .order{grid-area:order;display:flex}
 .app .pay{grid-area:pay;display:flex}
}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);border-radius:10px;touch-action:manipulation}
button:active{transform:scale(.96)}
.head{grid-area:head;display:flex;align-items:center;gap:6px;justify-content:space-between}
.tag{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px}
.tag b{font-size:28px;color:var(--ac);min-width:40px;text-align:center;line-height:1}
.tag button{width:32px;height:32px;font-size:17px}
.st{display:flex;gap:8px;font-size:11px;color:var(--mut);text-align:center}
.st b{display:block;font-size:15px;color:var(--tx)}
.ib{width:36px;height:36px;font-size:17px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{height:38px;font-size:15px;font-weight:800}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sum{display:flex;flex-direction:row;gap:6px;padding:6px}
.sum>div{overflow:hidden;flex:1;background:var(--bg);border-radius:10px;padding:3px 8px;font-size:11px;color:var(--mut);min-width:0}
.sum b{display:block;font-size:clamp(20px,3.4vh,28px);color:var(--tx);line-height:1.15;white-space:nowrap}
.sum .t{flex:1.2}.sum .t b{color:var(--ac)}
.sum .c b{color:var(--ac2)}.sum .c.bad b{color:var(--bad)}
.items{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.item{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px dashed var(--bd)}
.item:last-child{border:0}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.nm{font-size:18px;font-weight:800}.pr{color:var(--mut);font-size:11px;margin-left:6px;font-weight:400}
.sub{font-size:13px;color:var(--mut)}
.qr{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}
.qr button{font-size:clamp(22px,4.5vh,36px);font-weight:800;min-height:0}
.qr .p{background:var(--ac);color:#fff;border-color:var(--ac)}
.qr .p5{background:#c2410c;color:#fff;border-color:#c2410c}
.qr .n{display:flex;align-items:center;justify-content:center;font-size:clamp(28px,6vh,48px);font-weight:800;background:var(--bg);border-radius:10px}
.clr{margin-top:4px;height:30px;font-size:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.quick button{height:34px;font-size:13px;font-weight:700}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.pad button{font-size:clamp(22px,4.5vh,36px);line-height:1;padding:0;font-weight:700;min-height:0}
.go{height:clamp(42px,7vh,56px);font-size:17px;font-weight:800;background:var(--ac2);color:#fff;border-color:var(--ac2);margin-top:6px}
.go:disabled{opacity:.4}
.wh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;margin-bottom:4px;gap:4px}
.wh button{font-size:11px;padding:3px 8px}
.chips{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.chip{flex:none;background:var(--wt);border:2px solid var(--ac);border-radius:10px;padding:3px 8px;text-align:left;line-height:1.2;min-width:90px}
.chip b{font-size:20px;color:var(--ac)}.chip small{display:block;font-size:11px}
.empty{color:var(--mut);font-size:12px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal.on{display:flex}
.mb{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:460px;max-height:100%;overflow-y:auto}
.set{display:grid;grid-template-columns:1fr 64px 60px 70px;gap:4px;margin:8px 0;font-size:12px;align-items:center}
.set input,.srch{width:100%;font:inherit;padding:6px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.mb .btn{display:block;width:100%;height:38px;margin-top:6px;font-size:13px}
.hint{font-size:11px;color:var(--mut);margin:4px 0}
.hr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.hr .no{font-size:24px;font-weight:800;color:var(--ac);min-width:44px}
.hr .ds{flex:1;font-size:13px}.hr .ds small{display:block;color:var(--mut)}
.hr button{font-size:12px;padding:6px 10px;min-width:70px}
.hr button.w{background:var(--wt);border-color:var(--ac)}
</style>
</head>
<body>
<div class="app" id="app" data-v="order">
 <div class="head">
  <div class="tag">番号札<button onclick="tagAdd(-1)">−</button><b id="tag">1</b><button onclick="tagAdd(1)">＋</button></div>
  <div class="st"><div>売上<b id="sSales">0円</b></div><div>待ち<b id="sWait">0</b></div><div>渡済<b id="sDone">0</b></div></div>
  <div><button class="ib" onclick="openHist()">📋</button> <button class="ib" onclick="modal('modal',1)">⚙</button></div>
 </div>

 <div class="card sum">
  <div class="t">合計<b id="total">0円</b></div>
  <div>お預かり<b id="recv">0円</b></div>
  <div class="c" id="chgRow">おつり<b>0円</b></div>
 </div>

 <div class="tabs"><button id="tb-order" onclick="setView('order')">🍤 注文</button><button id="tb-pay" onclick="setView('pay')">🧮 電卓</button></div>

 <div class="card order">
  <div class="items" id="items"></div>
  <button class="clr" onclick="clearOrder()">注文をクリア</button>
 </div>

 <div class="card pay">
  <div class="quick">
   <button onclick="key('C')" style="color:var(--bad)">C</button>
   <button onclick="addRecv(1000)">+千円</button>
   <button onclick="addRecv(5000)">+5千円</button>
   <button onclick="addRecv(10000)">+1万円</button>
  </div>
  <div class="pad" id="pad"></div>
  <button class="go" id="go" onclick="finish()">会計完了 → 次の番号へ</button>
 </div>

 <div class="card wait">
  <div class="wh"><span>お渡し待ち（タップで渡した）</span><button onclick="undoDeliver()">渡済を戻す</button></div>
  <div class="chips" id="chips"></div>
 </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)modal('modal',0)">
 <div class="mb">
  <b>設定</b>
  <div class="set" id="set"></div>
  <p class="hint">まとめ買い：「◯個で△円」を入力（例：コロッケ 3個で250円）。個数を0にすると無効。端数は通常価格で計算します。</p>
  <button class="btn" onclick="undo()">直前の会計を取り消す</button>
  <button class="btn" style="color:var(--bad)" onclick="resetAll()">売上・履歴を全てリセット</button>
  <button class="btn" onclick="modal('modal',0)">閉じる</button>
 </div>
</div>

<div class="modal" id="hmodal" onclick="if(event.target===this)modal('hmodal',0)">
 <div class="mb">
  <b>📋 会計履歴（何番が何だったか）</b>
  <input class="srch" id="srch" type="number" inputmode="numeric" placeholder="番号で検索（例：1）" oninput="renderHist()" style="margin-top:8px">
  <div id="hlist"></div>
  <button class="btn" onclick="modal('hmodal',0)">閉じる</button>
 </div>
</div>

<script>
var S={items:[{n:"コロッケ",p:90,bn:0,bm:0,q:0},{n:"焼きそば",p:300,bn:0,bm:0,q:0}],tag:1,recv:0,log:[]};
try{var raw=localStorage.getItem("mosaten");if(raw){var d=JSON.parse(raw);if(d&&d.items){S.items=d.items.map(function(i){i.q=0;return i});S.tag=d.tag||1;S.log=(d.log||[]).map(function(l){if(l.d===undefined)l.d=true;return l})}}}catch(e){}
function save(){try{localStorage.setItem("mosaten",JSON.stringify({items:S.items,tag:S.tag,log:S.log}))}catch(e){}}
function cost(i){var q=i.q;if(i.bn>0&&i.bm>0&&q>=i.bn){return Math.floor(q/i.bn)*i.bm+(q%i.bn)*i.p}return q*i.p}
function total(){return S.items.reduce(function(a,i){return a+cost(i)},0)}
function yen(n){return n.toLocaleString("ja-JP")+"円"}
function setView(v){document.getElementById("app").setAttribute("data-v",v);document.getElementById("tb-order").className=v==="order"?"on":"";document.getElementById("tb-pay").className=v==="pay"?"on":""}
function qty(k,d){S.items[k].q=Math.max(0,S.items[k].q+d);render()}
function tagAdd(d){S.tag=Math.max(1,S.tag+d);save();render()}
function addRecv(n){S.recv+=n;render()}
function setRecv(n){S.recv=n;render()}
function key(k){if(k==="C")S.recv=0;else if(k==="ちょうど")S.recv=total();else{var v=S.recv*Math.pow(10,k.length)+Number(k);if(v<=9999999)S.recv=v}render()}
function clearOrder(){S.items.forEach(function(i){i.q=0});S.recv=0;render()}
function finish(){
 var t=total();if(t<=0||S.recv<t)return;
 S.log.push({tag:S.tag,q:S.items.map(function(i){return i.q}),t:t,r:S.recv,d:false});
 S.tag++;S.items.forEach(function(i){i.q=0});S.recv=0;save();setView("order");render()}
function deliver(idx){S.log[idx].d=true;S.log[idx].dt=Date.now();save();render()}
function toggleD(idx){var l=S.log[idx];if(l.d){l.d=false;delete l.dt}else{l.d=true;l.dt=Date.now()}save();render();renderHist()}
function undoDeliver(){var best=-1;S.log.forEach(function(l,i){if(l.d&&l.dt&&(best<0||l.dt>S.log[best].dt))best=i});if(best>=0){S.log[best].d=false;delete S.log[best].dt;save();render()}}
function undo(){var l=S.log.pop();if(!l)return;S.tag=l.tag;save();render();modal("modal",0)}
function resetAll(){if(confirm("売上と履歴を全て消します。よろしいですか？")){S.log=[];S.tag=1;clearOrder();save();render();modal("modal",0)}}
function modal(id,o){document.getElementById(id).className="modal"+(o?" on":"")}
function openHist(){document.getElementById("srch").value="";renderHist();modal("hmodal",1)}
function setField(k,f,v){S.items[k][f]=f==="n"?v:Math.max(0,parseInt(v,10)||0);save();render(true)}
function desc(l){return l.q.map(function(q,k){return q&&S.items[k]?S.items[k].n+"×"+q:""}).filter(Boolean).join(" ")}
function renderHist(){
 var f=document.getElementById("srch").value.trim(),h="";
 for(var i=S.log.length-1;i>=0;i--){var l=S.log[i];if(f&&String(l.tag)!==f)continue;
  h+='<div class="hr"><span class="no">'+l.tag+'</span><div class="ds">'+desc(l)+'<small>'+yen(l.t)+'（預かり'+yen(l.r)+'）</small></div>'+
  '<button class="'+(l.d?'':'w')+'" onclick="toggleD('+i+')">'+(l.d?'渡済 ✓':'渡す')+'</button></div>'}
 document.getElementById("hlist").innerHTML=h||'<div class="empty">該当なし</div>'}
function fit(el){var s=el.textContent,e=0;for(var i=0;i<s.length;i++){var ch=s.charAt(i);e+=ch==="円"?1.1:ch===","?0.45:0.75}var w=el.parentElement.clientWidth-24;el.style.fontSize=Math.max(10,Math.min(26,Math.floor(w/(e||1))))+"px"}
window.addEventListener("resize",function(){render(true)});
function render(keepSet){
 document.getElementById("tag").textContent=S.tag;
 document.getElementById("items").innerHTML=S.items.map(function(i,k){
  var b=i.bn>0&&i.bm>0?"（"+i.bn+"個"+i.bm+"円）":"";
  return '<div class="item"><div class="it"><span class="nm">'+i.n+'<span class="pr">'+i.p+'円'+b+'</span></span><span class="sub">'+yen(cost(i))+'</span></div>'+
  '<div class="qr"><button onclick="qty('+k+',-1)">−</button><div class="n">'+i.q+'</div><button class="p" onclick="qty('+k+',1)">＋</button><button class="p5" onclick="qty('+k+',5)">＋5</button></div></div>'}).join("");
 var t=total(),ch=S.recv-t;
 document.getElementById("total").textContent=yen(t);
 document.getElementById("recv").textContent=yen(S.recv);
 var c=document.getElementById("chgRow");
 c.className="c"+(ch<0&&t>0?" bad":"");
 c.innerHTML=(ch<0&&t>0?"不足":"おつり")+"<b>"+yen(t>0?Math.abs(ch):0)+"</b>";
 fit(document.getElementById("total"));fit(document.getElementById("recv"));fit(c.querySelector("b"));
 document.getElementById("go").disabled=!(t>0&&S.recv>=t);
 var sales=0,w=0,dn=0;
 S.log.forEach(function(l){sales+=l.t;if(l.d)dn++;else w++});
 document.getElementById("sSales").textContent=yen(sales);
 document.getElementById("sWait").textContent=w;
 document.getElementById("sDone").textContent=dn;
 var h="";
 S.log.forEach(function(l,i){if(!l.d)h+='<button class="chip" onclick="deliver('+i+')"><b>'+l.tag+'</b><small>'+desc(l)+'</small></button>'});
 document.getElementById("chips").innerHTML=h||'<div class="empty">待ちはありません</div>';
 if(!keepSet){
  document.getElementById("set").innerHTML='<b>商品</b><b>単価</b><b>まとめ数</b><b>まとめ額</b>'+S.items.map(function(i,k){
   return '<input value="'+i.n+'" onchange="setField('+k+',\'n\',this.value)">'+
   '<input type="number" inputmode="numeric" value="'+i.p+'" onchange="setField('+k+',\'p\',this.value)">'+
   '<input type="number" inputmode="numeric" value="'+i.bn+'" onchange="setField('+k+',\'bn\',this.value)">'+
   '<input type="number" inputmode="numeric" value="'+i.bm+'" onchange="setField('+k+',\'bm\',this.value)">'}).join("")}
}
var pad=document.getElementById("pad");
["7","8","9","4","5","6","1","2","3","0","00","ちょうど"].forEach(function(k){
 var b=document.createElement("button");b.textContent=k;if(k==="ちょうど"){b.style.fontSize="clamp(14px,2.8vh,20px)";b.style.background="var(--wt)";b.style.borderColor="var(--ac)"}b.onclick=function(){key(k)};pad.appendChild(b)});
setView("order");render();
</script>
</body>
</html>
