<style>
  :root{

    --sun:#3E8FB0; --rain:#6B7AA1; --both:#7C9A5B; --yellow:#F4B740; --coral:#E2603A; --line:#E7DFCF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Noto Sans JP',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,.mark{font-family:'Zen Maru Gothic',sans-serif;}

  header{
    padding:24px 18px 12px;
    background:radial-gradient(circle at 88% -10%, #FCE3B8 0%, transparent 45%),
      radial-gradient(circle at -10% 110%, #CFE3E9 0%, transparent 40%), var(--cream);
    border-bottom:1px solid var(--line);
  }
  header h1{margin:0 0 4px; font-size:21px; font-weight:900; letter-spacing:.02em;}
  header h1 span{color:var(--coral);}
  header p{margin:0 0 6px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .disclaimer{font-size:10px; color:#8a6a3f; background:#FBF0DC; display:inline-block; padding:4px 10px; border-radius:999px; margin-bottom:4px;}
  .save-note{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .save-note button{
    border:none; background:none; color:var(--sun); font-size:10.5px; font-weight:700;
    text-decoration:underline; padding:0; cursor:pointer;
  }

  .filters{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:2px solid var(--line);}
  .filters-toggle{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; cursor:pointer; user-select:none;
  }
  .filters-toggle .label{font-size:13px; font-weight:700;}
  .filters-toggle .sub{font-size:11px; color:var(--ink-soft); font-weight:500; margin-left:6px;}
  .filters-toggle .chev{font-size:11px; color:var(--ink-soft); transition:transform .2s;}
  .filters-toggle.open .chev{transform:rotate(180deg);}
  .filters-body{display:none; padding:0 14px 12px;}
  .filters-body.open{display:block;}
  .filter-row{margin-bottom:8px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-label{font-size:10.5px; color:var(--ink-soft); margin:0 0 6px 2px; font-weight:700;}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
    color:var(--ink); font-size:12.5px; font-weight:500; white-space:nowrap; cursor:pointer; transition:.15s;}
  .chip.active{background:var(--ink); border-color:var(--ink); color:var(--cream);}
  .chip.w-sun.active{background:var(--sun); border-color:var(--sun); color:#fff;}
  .chip.w-rain.active{background:var(--rain); border-color:var(--rain); color:#fff;}
  .chip.w-both.active{background:var(--both); border-color:var(--both); color:#fff;}
  .chip.p-yes.active{background:#4F7942; border-color:#4F7942; color:#fff;}
  .chip.fav.active{background:var(--coral); border-color:var(--coral); color:#fff;}

  .zip-row{display:flex; gap:6px; align-items:center;}
  .zip-row input{
    flex:1; min-width:0; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; font-family:inherit; background:var(--paper); color:var(--ink);
  }
  .zip-row button{
    flex:0 0 auto; padding:8px 14px; border-radius:8px; border:none; background:var(--sun);
    color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .zip-status{font-size:11px; color:var(--ink-soft); margin-top:5px; min-height:14px;}

  .result-count{padding:10px 16px 0; font-size:12px; color:var(--ink-soft);}
  .result-count b{color:var(--ink);}

  main{padding:8px 12px 30px;}
  .region{margin-top:22px;}
  .region-title{display:flex; align-items:baseline; gap:8px; margin:0 2px 10px;}
  .region-title h2{font-size:15px; margin:0; font-weight:700;}
  .region-title .count{font-size:11px; color:var(--ink-soft);}

  .cards{display:flex; flex-direction:column; gap:10px;}

  .card{background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--both);
    border-radius:10px; padding:14px 14px 12px; position:relative;}
  .card.w-晴れ{border-left-color:var(--sun);}
  .card.w-雨{border-left-color:var(--rain);}
  .card.is-visited{opacity:.6;}

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:5px;}
  .card-name{font-size:15px; font-weight:700; line-height:1.4;}
  .card-area{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .card-dist{font-size:10.5px; color:var(--sun); font-weight:700; margin-top:2px;}

  .duration-tag{flex:0 0 auto; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:#F1EADA; color:var(--ink-soft); white-space:nowrap;}
  .duration-tag.full{background:var(--yellow); color:#5b4009;}

  .card-desc{font-size:12.5px; line-height:1.7; color:var(--ink); margin:6px 0 8px;}

  .tag-row{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px;}
  .tag{font-size:10.5px; padding:3px 8px; border-radius:6px; background:#F1EADA; color:var(--ink-soft); font-weight:500;}
  .tag.age-hit{background:var(--ink); color:var(--cream);}

  .info-grid{display:flex; flex-direction:column; gap:4px; margin:8px 0; padding:8px 10px; background:#F5F0E4; border-radius:8px;}
  .info-row{display:flex; gap:6px; font-size:11.5px; color:var(--ink);}
  .info-row .ico{flex:0 0 auto; width:16px;}
  .info-row .lbl{flex:0 0 auto; color:var(--ink-soft); width:44px;}
  .info-row .val{flex:1;}

  .tip{font-size:11.5px; color:#7a5a3a; background:#FBF0DC; border-radius:8px; padding:7px 10px; line-height:1.6; margin-bottom:9px;}
  .tip b{color:var(--coral);}

  .weather-icons{font-size:12px;}

  .action-row{display:flex; gap:6px; flex-wrap:wrap;}
  .abtn{
    flex:0 0 auto; font-size:11px; padding:6px 10px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer; font-weight:600; text-decoration:none;
  }
  .abtn.on{background:var(--coral); border-color:var(--coral); color:#fff;}
  .abtn.on.visited{background:#4F7942; border-color:#4F7942;}
  .abtn.on.excluded{background:#8a8378; border-color:#8a8378;}
  .abtn.link{background:#EFE9DA;}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px;}

  footer{text-align:center; padding:18px 20px 24px; font-size:10px; color:var(--ink-soft); border-top:1px solid var(--line); line-height:1.7;}
</style>

<header>

</header>

<div class="filters">

  </div>

    </div>
    <div class="filter-row">

      <div class="chips" id="durationChips"></div>
    </div>
    <div class="filter-row">

      <div class="chips" id="parkingChips"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">自宅からの目安（郵便番号を入力）</div>
      <div class="zip-row">
        <input type="text" id="zipInput" placeholder="例）100-0001" maxlength="8">
        <button id="zipBtn">絞り込む</button>
      </div>
      <div class="zip-status" id="zipStatus"></div>
      <div class="chips" id="distChips" style="margin-top:6px; display:none;"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">表示の絞り込み</div>
      <div class="chips" id="viewChips"></div>
    </div>
  </div>
</div>

<div class="result-count" id="resultCount"></div>

<main id="main"></main>

let state = {
  ages:new Set(), weather:"all", duration:"all", parking:"all", dist:"all",
  favOnly:false, hideVisited:false, showExcluded:false,
  favorites:new Set(), visited:new Set(), excluded:new Set(),
  homeLoc:null, filtersOpen:false
};

function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function savePersisted(){
  try{
    const zipInput = document.getElementById("zipInput");
    const zipStatus = document.getElementById("zipStatus");
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      favorites:[...state.favorites],
      visited:[...state.visited],
      excluded:[...state.excluded],
      homeLoc: state.homeLoc,
      zipRaw: zipInput ? zipInput.value : "",
      zipLabel: zipStatus ? zipStatus.textContent : ""
    }));
  }catch(e){ /* localStorage unavailable (e.g. private browsing) - continue without saving */ }
}
function applyPersisted(p){
  if(!p) return;
  state.favorites = new Set(p.favorites||[]);
  state.visited = new Set(p.visited||[]);
  state.excluded = new Set(p.excluded||[]);
  if(p.homeLoc) state.homeLoc = p.homeLoc;
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function estimateMinutes(km){
  if(km<=15) return km/25*60;
  return (15/25*60) + (km-15)/55*60;
}

function buildChips(containerId, items, isActive, onClick, extraClass){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  items.forEach(item=>{
    const c = document.createElement("div");
    c.className = "chip" + (extraClass ? extraClass(item) : "") + (isActive(item) ? " active" : "");
    c.textContent = item.label;
    c.onclick = ()=>{ onClick(item); render(); };
    el.appendChild(c);
  });
}

function buildAgeChips(){
  const el = document.getElementById("ageChips");
  el.innerHTML = "";
  AGES.forEach(age=>{
    const c = document.createElement("div");
    c.className = "chip" + (state.ages.has(age) ? " active" : "");
    c.textContent = age;
    c.onclick = ()=>{
      if(state.ages.has(age)) state.ages.delete(age); else state.ages.add(age);
      render();
    };
    el.appendChild(c);
  });
}
function buildWeatherChips(){
  buildChips("weatherChips", WEATHERS, w=>state.weather===w.key, w=>state.weather=w.key,
    w=>w.key==="晴れ"?" w-sun":w.key==="雨"?" w-rain":" w-both");
}
function buildDurationChips(){
  buildChips("durationChips", DURATIONS, d=>state.duration===d.key, d=>state.duration=d.key);
}
function buildParkingChips(){
  buildChips("parkingChips", PARKINGS, p=>state.parking===p.key, p=>state.parking=p.key,
    p=>p.key==="yes" ? " p-yes" : "");
}
function buildDistChips(){
  buildChips("distChips", DISTS, d=>state.dist===d.key, d=>state.dist=d.key);
}
function buildViewChips(){
  const el = document.getElementById("viewChips");
  el.innerHTML = "";
  VIEWS.forEach(v=>{
    const c = document.createElement("div");
    const active = v.key==="favOnly"?state.favOnly : v.key==="hideVisited"?state.hideVisited : state.showExcluded;
    c.className = "chip" + (v.key==="favOnly"?" fav":"") + (active ? " active" : "");
    c.textContent = v.label;
    c.onclick = ()=>{
      if(v.key==="favOnly") state.favOnly = !state.favOnly;
      else if(v.key==="hideVisited") state.hideVisited = !state.hideVisited;
      else state.showExcluded = !state.showExcluded;
      render(); // render() が buildViewChips() も呼ぶため個別呼び出しは不要
    };
    el.appendChild(c);
  });
}

function countActiveFilters(){
  let n = 0;
  if(state.ages.size>0) n++;
  if(state.weather!=="all") n++;
  if(state.duration!=="all") n++;
  if(state.parking!=="all") n++;
  if(state.dist!=="all" && state.homeLoc) n++;
  if(state.favOnly) n++;
  if(state.hideVisited) n++;
  return n;
}
function updateFiltersSummary(){
  const n = countActiveFilters();
  document.getElementById("filtersSummary").textContent = n>0 ? `（${n}件 適用中）` : "";
}

document.getElementById("filtersToggle").onclick = ()=>{
  state.filtersOpen = !state.filtersOpen;
  const toggle = document.getElementById("filtersToggle");
  const body = document.getElementById("filtersBody");
  toggle.classList.toggle("open", state.filtersOpen);
  body.classList.toggle("open", state.filtersOpen);
};

document.getElementById("resetBtn").onclick = ()=>{
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  // 保存データ(お気に入り/行った/除外/郵便番号)だけでなく、
  // 画面上の絞り込み条件(年齢・天気・所要時間・駐車場・距離・表示切替)も全てリセットする
  state.ages = new Set();
  state.weather = "all";
  state.duration = "all";
  state.parking = "all";
  state.dist = "all";
  state.favOnly = false;
  state.hideVisited = false;
  state.showExcluded = false;
  state.favorites = new Set();
  state.visited = new Set();
  state.excluded = new Set();
  state.homeLoc = null;
  document.getElementById("zipInput").value = "";
  document.getElementById("zipStatus").textContent = "";
  document.getElementById("distChips").style.display = "none";
  render();
};

document.getElementById("zipBtn").onclick = async ()=>{
  const raw = document.getElementById("zipInput").value.replace(/[^0-9]/g,"");
  const statusEl = document.getElementById("zipStatus");
  if(raw.length!==7){ statusEl.textContent = "7桁の郵便番号を入力してください（例：1000001）"; return; }
  statusEl.textContent = "検索中…";
  try{
    const res = await fetch(`https://geoapi.heartrails.com/api/json?method=searchByPostal&postal=${raw}`);
    const data = await res.json();
    const locations = data?.response?.location;
    if(!locations || locations.length === 0){
      statusEl.textContent = "郵便番号が見つかりませんでした。番号をご確認ください。";
      return;
    }
    const loc = locations[0];
    state.homeLoc = {lat:parseFloat(loc.y), lng:parseFloat(loc.x)};
    statusEl.textContent = `${loc.prefecture}${loc.city}${loc.town||""} を起点に距離を計算しました`;
    document.getElementById("distChips").style.display = "flex";
    savePersisted();
    render();
  }catch(e){
    statusEl.textContent = "検索に失敗しました。通信環境をご確認のうえ再度お試しください。";
  }
};

function matches(spot){
  if(state.ages.size>0 && !spot.ages.some(a=>state.ages.has(a))) return false;
  if(state.weather!=="all" && !spot.weather.includes(state.weather)) return false;
  if(state.duration!=="all" && !spot.duration.includes(state.duration)) return false;
  if(state.parking!=="all" && spot.parking!==state.parking) return false;
  if(state.homeLoc && state.dist!=="all"){
    const km = haversineKm(state.homeLoc.lat,state.homeLoc.lng,spot.lat,spot.lng);
    const min = estimateMinutes(km);
    if(state.dist==="30" && min>30) return false;
    if(state.dist==="60" && min>60) return false;
  }
  if(state.favOnly && !state.favorites.has(spot.name)) return false;
  if(state.hideVisited && state.visited.has(spot.name)) return false;
  if(!state.showExcluded && state.excluded.has(spot.name)) return false;
  return true;
}

function weatherClass(spot){
  if(spot.weather.includes("晴れ") && spot.weather.includes("雨")) return "";
  if(spot.weather.includes("晴れ")) return "w-晴れ";
  if(spot.weather.includes("雨")) return "w-雨";
  return "";
}
function weatherIcon(spot){
  const both = spot.weather.includes("晴れ") && spot.weather.includes("雨");
  if(both) return "☀️☔";
  if(spot.weather.includes("晴れ")) return "☀️";
  return "☔";
}
function mapsUrl(spot){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(spot.name + " " + spot.area);
}
function officialLink(spot){
  return spot.officialUrl || ("https://www.google.com/search?q=" + encodeURIComponent(spot.name + " 公式"));
}
function officialLabel(spot){
  return spot.officialUrl ? "公式HP" : "公式HPを検索";
}

function toggleSet(setName, name){
  const s = state[setName];
  if(s.has(name)) s.delete(name); else s.add(name);
  savePersisted();
  render();
}

function render(){
  // フィルターチップは常にここで再構築し、state と表示(active/反転)を必ず一致させる
  buildAgeChips();
  buildWeatherChips();
  buildDurationChips();
  buildParkingChips();
  buildDistChips();
  buildViewChips();
  updateFiltersSummary();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const filtered = SPOTS.filter(matches);
  document.getElementById("resultCount").innerHTML =
    `<b>${filtered.length}</b> / ${SPOTS.length} スポット`;

  if(filtered.length===0){
    main.innerHTML = `<div class="empty">条件に合うスポットが見つかりません。<br>絞り込みを減らしてみてください。</div>`;
    return;
  }

  if(state.homeLoc){
    const sorted = [...filtered].sort((a,b)=>
      haversineKm(state.homeLoc.lat,state.homeLoc.lng,a.lat,a.lng) -
      haversineKm(state.homeLoc.lat,state.homeLoc.lng,b.lat,b.lng)
    );
    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";
    sorted.forEach(spot=>cardsWrap.appendChild(buildCard(spot)));
    const sec = document.createElement("section");
    sec.className = "region";
    sec.innerHTML = `<div class="region-title"><h2>自宅から近い順</h2><span class="count">${sorted.length}件</span></div>`;
    sec.appendChild(cardsWrap);
    main.appendChild(sec);
    return;
  }

  const regions = [...new Set(filtered.map(s=>s.region))];
  const regionOrder = ["東京","神奈川","埼玉","千葉","茨城","栃木","群馬"];
  regions.sort((a,b)=>regionOrder.indexOf(a)-regionOrder.indexOf(b));

  regions.forEach(region=>{
    const spots = filtered.filter(s=>s.region===region);
    const sec = document.createElement("section");
    sec.className = "region";
    sec.innerHTML = `<div class="region-title"><h2>${region}</h2><span class="count">${spots.length}件</span></div>`;
    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";
    spots.forEach(spot=>cardsWrap.appendChild(buildCard(spot)));
    sec.appendChild(cardsWrap);
    main.appendChild(sec);
  });
}

function buildCard(spot){
  const card = document.createElement("div");
  const isVisited = state.visited.has(spot.name);
  card.className = "card " + weatherClass(spot) + (isVisited ? " is-visited" : "");
  const ageTagsHtml = spot.ages.map(a=>
    `<span class="tag ${state.ages.has(a)?"age-hit":""}">${a}</span>`
  ).join("");
  const durationLabel = spot.duration.includes("1日") && !spot.duration.includes("半日") ? "1日"
    : spot.duration.includes("半日") && !spot.duration.includes("1日") ? "半日"
    : "半日〜1日";
  const durationClass = spot.duration.includes("1日") ? "full" : "";
  const parkingLabel = spot.parking==="yes" ? "あり" : "なし・少なめ";
  let distHtml = "";
  if(state.homeLoc){
    const km = haversineKm(state.homeLoc.lat,state.homeLoc.lng,spot.lat,spot.lng);
    const min = Math.round(estimateMinutes(km));
    distHtml = `<div class="card-dist">🚗 自宅から車で約${min}分・${Math.round(km)}km（目安）</div>`;
  }
  const isFav = state.favorites.has(spot.name);
  const isExcluded = state.excluded.has(spot.name);
  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-name">${spot.name}</div>
        <div class="card-area">${spot.area}</div>
        ${distHtml}
      </div>
      <div class="duration-tag ${durationClass}">${durationLabel}</div>
    </div>
    <div class="card-desc">${spot.desc}</div>
    <div class="tag-row">${ageTagsHtml}<span class="tag weather-icons">${weatherIcon(spot)}</span></div>
    <div class="info-grid">
      <div class="info-row"><span class="ico">💰</span><span class="lbl">料金</span><span class="val">${spot.price}</span></div>
      <div class="info-row"><span class="ico">🅿️</span><span class="lbl">駐車場</span><span class="val">${parkingLabel}</span></div>
      <div class="info-row"><span class="ico">🚉</span><span class="lbl">アクセス</span><span class="val">${spot.access}</span></div>
      <div class="info-row"><span class="ico">🍼</span><span class="lbl">赤ちゃん</span><span class="val">${spot.baby}</span></div>
      <div class="info-row"><span class="ico">🍴</span><span class="lbl">食事</span><span class="val">${spot.lunch}</span></div>
    </div>
    <div class="tip"><b>ひとこと：</b>${spot.tip}</div>
    <div class="action-row">
      <button class="abtn ${isFav?"on":""}" data-act="fav">⭐ お気に入り</button>
      <button class="abtn ${isVisited?"on visited":""}" data-act="visited">✅ 行った</button>
      <button class="abtn ${isExcluded?"on excluded":""}" data-act="exclude">🚫 除外</button>
      <a class="abtn link" href="${mapsUrl(spot)}" target="_blank" rel="noopener">🗺️ Googleマップ</a>
      <a class="abtn link" href="${officialLink(spot)}" target="_blank" rel="noopener">🔗 ${officialLabel(spot)}</a>
    </div>
  `;
  card.querySelector('[data-act="fav"]').onclick = ()=>toggleSet("favorites", spot.name);
  card.querySelector('[data-act="visited"]').onclick = ()=>toggleSet("visited", spot.name);
  card.querySelector('[data-act="exclude"]').onclick = ()=>toggleSet("excluded", spot.name);
  return card;
}

// init
const persisted = loadPersisted(); // localStorageの読み込みは1回だけ行い、使い回す
applyPersisted(persisted);
if(persisted && persisted.zipRaw) document.getElementById("zipInput").value = persisted.zipRaw;
if(persisted && persisted.zipLabel) document.getElementById("zipStatus").textContent = persisted.zipLabel;
if(state.homeLoc) document.getElementById("distChips").style.display = "flex";
render(); // render() が全チップ(年齢・天気・所要時間・駐車場・距離・表示)と一覧を初期描画する
</script>
